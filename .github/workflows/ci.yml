name: CI events api

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: say hello
        run: ls -la

      - name: Checkout my code
        uses: actions/checkout@v5


      - name: Build docker image
        run: |
          docker build -t events-api:latest .

      - name: Run container
        run: |
          docker run -d -p 5000:5000 --name events-api-test events-api:latest
          

      - name: is the container running
        run: |
          sleep 5
          docker ps
          curl http://localhost:5000/api/health || exit 1

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'


      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: run tests
        run: |
          pytest -v

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout my code
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and tag image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest .

      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest

      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" > /dev/null

      - name: Wait for Render
        run: |
          sleep 90

      - name: Smoke test on Render
        run: |
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors "${{ secrets.RENDER_BASE_URL }}/api/health"  




name: CI events api

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: say hello
        run: ls -la

      - name: Checkout my code
        uses: actions/checkout@v5


      - name: Build docker image
        run: |
          docker build -t events-api:latest .

      - name: Run container
        run: |
          docker run -d -p 5000:5000 --name events-api-test events-api:latest
          

      - name: is the container running
        run: |
          sleep 5
          docker ps
          curl http://localhost:5000/api/health || exit 1

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'


      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: run tests
        run: |
          pytest -v
          
      



